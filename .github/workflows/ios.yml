name: iOS

on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

jobs:
  build:
    # Compiles the iOS app for the simulator to prove the project builds.
    # Store uploads are signed from Xcode (see docs/PUBLIER.md).
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_REVENUECAT_IOS_KEY: ${{ vars.VITE_REVENUECAT_IOS_KEY }}
          VITE_REVENUECAT_ANDROID_KEY: ${{ vars.VITE_REVENUECAT_ANDROID_KEY }}
          VITE_WEB_PURCHASE_LINK: ${{ vars.VITE_WEB_PURCHASE_LINK }}
      - run: npx cap sync ios
      - name: Build for simulator
        working-directory: ios/App
        run: |
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -40
          test ${PIPESTATUS[0]} -eq 0
