name: Android

on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # The Android SDK is preinstalled on GitHub's Ubuntu runners (ANDROID_HOME).

      - run: npm ci
      - run: npm run build
        env:
          VITE_REVENUECAT_IOS_KEY: ${{ vars.VITE_REVENUECAT_IOS_KEY }}
          VITE_REVENUECAT_ANDROID_KEY: ${{ vars.VITE_REVENUECAT_ANDROID_KEY }}
          VITE_WEB_PURCHASE_LINK: ${{ vars.VITE_WEB_PURCHASE_LINK }}
      - run: npx cap sync android

      # Debug APK: install it directly on an Android phone or tablet to test.
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: constellamind-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      # Signed App Bundle for Google Play, only when the signing secrets exist.
      - name: Build signed release bundle
        if: ${{ env.KEYSTORE_B64 != '' }}
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        working-directory: android
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/release.jks" ./gradlew bundleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        if: ${{ hashFiles('android/app/build/outputs/bundle/release/*.aab') != '' }}
        with:
          name: constellamind-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
    env:
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
